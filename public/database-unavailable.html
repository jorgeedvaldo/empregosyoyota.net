<!doctype html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Serviço temporariamente indisponível - Empregos Yoyota</title>

    <!--
        Página servida com HTTP 503 quando a base de dados não responde e não
        existe cópia guardada da página pedida.

        É propositadamente estática: não passa pelo Laravel, não faz consultas
        e não vai buscar nada ao exterior — tipos de letra, folhas de estilo e
        imagens incluídos. Tudo o que precisa está neste ficheiro, porque o
        momento em que é mostrada é exactamente aquele em que não se pode
        contar com mais nada.
    -->

    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            color: #000000;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        header {
            border-bottom: 1px solid #e9ecef;
            padding: 1.25rem 1.5rem;
        }

        .brand {
            font-size: 1.5rem;
            color: #000000;
            text-decoration: none;
            letter-spacing: -0.01em;
        }

        .brand .empregos {
            font-weight: 600;
        }

        .brand .yoyota {
            font-weight: 300;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .card {
            width: 100%;
            max-width: 34rem;
            text-align: center;
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.75rem;
            border-radius: 50%;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 32px;
            height: 32px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            line-height: 1.25;
            margin: 0 0 1rem;
        }

        p {
            color: #6c757d;
            margin: 0 0 1rem;
        }

        .actions {
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.75rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid #000000;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-dark {
            background: #000000;
            color: #ffffff;
        }

        .btn-dark:hover {
            background: #333333;
            border-color: #333333;
        }

        .btn-outline {
            background: transparent;
            color: #000000;
        }

        .btn-outline:hover {
            background: #000000;
            color: #ffffff;
        }

        footer {
            border-top: 1px solid #e9ecef;
            padding: 1.5rem;
            text-align: center;
            color: #6c757d;
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.4rem;
            }

            .actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="/">
            <span class="empregos">Empregos</span><span class="yoyota">Yoyota</span>
        </a>
    </header>

    <main>
        <div class="card">
            <div class="icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                    <path d="M7.5 4a.5.5 0 0 1 1 0v4.5a.5.5 0 0 1-1 0zM8 10.5a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5"/>
                </svg>
            </div>

            <h1>Serviço temporariamente indisponível</h1>

            <p>
                Estamos a realizar operações de recuperação do sistema. Algumas
                funcionalidades poderão estar temporariamente indisponíveis.
            </p>

            <p>
                Por favor, tente novamente dentro de alguns instantes.
            </p>

            <div class="actions">
                <button type="button" class="btn btn-dark" onclick="window.location.reload()">
                    Tentar novamente
                </button>
                <a class="btn btn-outline" href="/">Ir para a página inicial</a>
            </div>
        </div>
    </main>

    <footer>
        &copy; Empregos Yoyota
    </footer>
</body>
</html>
